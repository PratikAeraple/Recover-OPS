<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
 <title id="title">RECOVEROPS resilience architecture</title><desc id="desc">Planned virtualized services create protected independent copies that are restored into a separate verification environment.</desc>
 <rect x="18" y="18" width="684" height="384" rx="18" fill="#f7f6ef" stroke="#cbd4c6"/>
 <g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="42" y="74" width="175" height="270" rx="12" fill="#e7ecdf" stroke="#7c9871"/><text x="129" y="105" fill="#34573a" font-size="14" font-weight="700">VIRTUALIZATION</text><text x="129" y="132" fill="#58685b" font-size="12">Proxmox · planned</text><rect x="65" y="161" width="129" height="56" rx="8" fill="#fff" stroke="#b9c6b3"/><text x="129" y="185" fill="#2d3d32" font-size="12" font-weight="700">Linux guests</text><text x="129" y="202" fill="#657267" font-size="10">Docker workloads</text><rect x="65" y="238" width="129" height="56" rx="8" fill="#fff" stroke="#b9c6b3"/><text x="129" y="262" fill="#2d3d32" font-size="12" font-weight="700">Windows guest</text><text x="129" y="279" fill="#657267" font-size="10">licensed lab required</text>
  <rect x="273" y="74" width="175" height="270" rx="12" fill="#e4ebdf" stroke="#7c9871"/><text x="360" y="105" fill="#34573a" font-size="14" font-weight="700">PROTECTED COPIES</text><text x="360" y="132" fill="#58685b" font-size="12">ZFS / encrypted copy</text><rect x="297" y="166" width="127" height="46" rx="23" fill="#fff" stroke="#b9c6b3"/><text x="360" y="194" fill="#2d3d32" font-size="12">snapshots ≠ backup</text><rect x="297" y="239" width="127" height="62" rx="8" fill="#31573b"/><text x="360" y="264" fill="#fff" font-size="12" font-weight="700">Independent host</text><text x="360" y="284" fill="#e3f0df" font-size="10">separate credentials</text>
  <rect x="503" y="74" width="175" height="270" rx="12" fill="#e9eee4" stroke="#7c9871"/><text x="590" y="105" fill="#34573a" font-size="14" font-weight="700">RESTORE & VERIFY</text><text x="590" y="132" fill="#58685b" font-size="12">isolated recovery plane</text><circle cx="590" cy="216" r="45" fill="#fff" stroke="#7c9871" stroke-width="2"/><path d="m570 216 13 13 28-31" fill="none" stroke="#426e4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="291" fill="#2d3d32" font-size="11">hash + service checks</text>
